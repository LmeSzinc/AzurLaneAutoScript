[project]
name = "alas"
version = "1.0.0"
description = "AzurLaneAutoScript (Alas)"
requires-python = ">=3.10"
license = { text = "GPL-3.0" }

dependencies = [
    # Image processing
    "numpy>=1.24,<2",
    "scipy>=1.10",
    "pillow>=9.5",
    "opencv-python>=4.8",
    "imageio",
    # OCR (onnxruntime backend, models converted from self-trained mxnet checkpoints)
    "onnxruntime>=1.15",
    # Device connection
    "adbutils==0.11.0",
    "uiautomator2==2.16.17",
    "uiautomator2cache==0.3.0.1",
    "wrapt>=1.14",
    "retrying",
    "lz4",
    "av>=10",
    "psutil>=5.9",
    # Utils
    "rich>=11",
    "tqdm",
    "jellyfish==0.11.2",
    "pyyaml",
    "inflection",
    "pydantic>=1.10,<2",
    "aiofiles",
    "prettytable>=2.2",
    "anyio>=1.3",
    # Pushing
    "onepush==1.4.0",
    "pycryptodome==3.9.9",
    "pypresence==4.2.1",
    # Webui
    "starlette>=0.40",
    "uvicorn>=0.30",
    "websockets>=12",
    "fastapi>=0.115",
]

[dependency-groups]
dev = [
    "ruff>=0.5",
]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
    "config",
    "deploy",
    "dev_tools",
    "webapp",
]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = [
    "E501",  # line too long, handled by line-length convention in legacy code
    "E402",  # module level import not at top of file
    "E722",  # bare except, used heavily in legacy code
    "E731",  # lambda assignment
    "F403",  # star import, used in legacy module.base.utils
    "F405",  # name may be undefined from star import
    "B008",  # function call in default argument
    "B905",  # zip without strict, py<3.10 compatibility in legacy code
]
